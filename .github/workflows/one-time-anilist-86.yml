name: One-time AniList 86 completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-anilist-86.yml]
permissions:
  contents: read
concurrency:
  group: one-time-anilist-86
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
    steps:
      - name: Verify and update exactly one anime
        shell: python
        run: |
          import os, json, urllib.request, sys
          token=os.environ.get('ANILIST_ACCESS_TOKEN','')
          if not token: sys.exit('Missing AniList token')
          endpoint='https://graphql.anilist.co'
          def gql(query,variables=None):
              body=json.dumps({'query':query,'variables':variables or {}}).encode()
              req=urllib.request.Request(endpoint,body,headers={'Content-Type':'application/json','Authorization':'Bearer '+token},method='POST')
              with urllib.request.urlopen(req,timeout=20) as response: data=json.load(response)
              if data.get('errors'): raise RuntimeError('AniList GraphQL returned errors')
              return data['data']
          viewer=gql('query{Viewer{id name}}')['Viewer']
          if viewer['name']!='Luciedmeo': sys.exit('Wrong AniList account')
          search=gql('query{Page(perPage:20){media(search:"86",type:ANIME){id type format seasonYear episodes title{romaji english} synonyms}}}')['Page']['media']
          matches=[m for m in search if m['episodes']==23 and m['type']=='ANIME' and (m['title'].get('english') or '').lower()=='86 eighty-six']
          if len(matches)!=1: sys.exit('Ambiguous 86 media match: '+str(len(matches)))
          media=matches[0]
          mid=media['id']
          before=gql('query($id:Int){Media(id:$id,type:ANIME){id episodes title{english romaji} mediaListEntry{id status progress scoreRaw notes repeat private hiddenFromStatusLists startedAt{year month day} completedAt{year month day} customLists(asArray:true)}}}',{'id':mid})['Media']
          if before['id']!=mid or before['episodes']!=23: sys.exit('Media mismatch')
          old=before['mediaListEntry']
          if old and old['status']=='COMPLETED' and old['progress']==23:
              print('ALREADY_CORRECT 23/23')
              sys.exit(0)
          if old and (old['status']=='REPEATING' or (old['progress'] or 0)>23):
              sys.exit('Conflicting current state')
          gql('mutation($id:Int){SaveMediaListEntry(mediaId:$id,status:COMPLETED,progress:23){id}}',{'id':mid})
          after=gql('query($id:Int){Media(id:$id,type:ANIME){mediaListEntry{id status progress scoreRaw notes repeat private hiddenFromStatusLists startedAt{year month day} customLists(asArray:true)}}}',{'id':mid})['Media']['mediaListEntry']
          if after['status']!='COMPLETED' or after['progress']!=23: sys.exit('Readback failed')
          if old:
              for field in ('scoreRaw','notes','repeat','private','hiddenFromStatusLists','startedAt','customLists'):
                  if old[field]!=after[field]: sys.exit('Unrelated field changed: '+field)
          print('APPLIED_AND_VERIFIED 86 23/23 for Luciedmeo')
