name: Animu Check and Complete Three Anime

on:
  push:
    branches:
      - animu/check-complete-three-20261007
    paths:
      - .github/workflows/animu-check-complete-three.yml

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
      TARGET_USER: Luciedmeo
    steps:
      - name: Check and update confirmed completed anime
        shell: bash
        run: |
          if [ -z "$ANILIST_ACCESS_TOKEN" ]; then
            echo "::error::ANILIST_ACCESS_TOKEN is not configured."
            exit 1
          fi

          node <<'NODE'
          const endpoint = "https://graphql.anilist.co";
          const token = process.env.ANILIST_ACCESS_TOKEN;
          const targetUser = process.env.TARGET_USER;
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          const requested = [
            { search: "Ergo Proxy", exact: "Ergo Proxy" },
            { search: "Serial Experiments Lain", exact: "Serial Experiments Lain" },
            { search: "Cyberpunk: Edgerunners", exact: "Cyberpunk: Edgerunners" },
          ];

          async function gql(query, variables={}) {
            for (let attempt=0; attempt<6; attempt++) {
              const res = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Authorization": `Bearer ${token}`,
                },
                body: JSON.stringify({query, variables}),
              });
              let payload = null;
              try { payload = await res.json(); } catch {}
              const rateLimited = res.status === 429 ||
                payload?.errors?.some(e => e?.status === 429 || /too many requests/i.test(e?.message ?? ""));
              if (rateLimited && attempt < 5) {
                const retryAfter = Number(res.headers.get("retry-after") || 0);
                await sleep(Math.max(retryAfter*1000, 4000*(attempt+1)));
                continue;
              }
              if (!res.ok || payload?.errors) {
                throw new Error(`AniList GraphQL error: ${JSON.stringify(payload?.errors ?? payload ?? {status:res.status})}`);
              }
              await sleep(1800);
              return payload.data;
            }
            throw new Error("AniList retries exhausted");
          }

          function hasDate(v) {
            return Boolean(v && (v.year || v.month || v.day));
          }

          async function viewer() {
            return (await gql(`query{
              Viewer{
                name
                options{disabledListActivity{type disabled}}
              }
            }`)).Viewer;
          }

          async function resolveMedia(item) {
            const data = await gql(`query($search:String){
              Media(search:$search,type:ANIME){
                id
                format
                status
                episodes
                title{romaji english}
                mediaListEntry{
                  id status progress
                  startedAt{year month day}
                  completedAt{year month day}
                }
              }
            }`, {search:item.search});
            const m = data.Media;
            if (!m) throw new Error(`No AniList result for ${item.search}`);
            const titles = [m.title?.english, m.title?.romaji].filter(Boolean);
            if (!titles.includes(item.exact)) {
              throw new Error(`Unexpected search match for ${item.search}: ${JSON.stringify(m.title)}`);
            }
            if (m.status !== "FINISHED" || !Number.isInteger(m.episodes) || m.episodes < 1) {
              throw new Error(`${item.exact}: cannot safely mark complete (status=${m.status}, episodes=${m.episodes})`);
            }
            return m;
          }

          async function setActivityOptions(options) {
            await gql(`mutation($options:[ListActivityOptionInput]){
              UpdateUser(disabledListActivity:$options){id}
            }`, {options});
          }

          async function saveComplete(mediaId, progress) {
            return (await gql(`mutation($mediaId:Int,$status:MediaListStatus,$progress:Int){
              SaveMediaListEntry(mediaId:$mediaId,status:$status,progress:$progress){
                id status progress
                startedAt{year month day}
                completedAt{year month day}
              }
            }`, {mediaId, status:"COMPLETED", progress})).SaveMediaListEntry;
          }

          async function clearAutoDates(entry, before) {
            const vars = {id: entry.id};
            let needed = false;
            if (!hasDate(before?.startedAt) && hasDate(entry.startedAt)) {
              vars.startedAt = {};
              needed = true;
            }
            if (!hasDate(before?.completedAt) && hasDate(entry.completedAt)) {
              vars.completedAt = {};
              needed = true;
            }
            if (!needed) return;
            await gql(`mutation($id:Int,$startedAt:FuzzyDateInput,$completedAt:FuzzyDateInput){
              SaveMediaListEntry(id:$id,startedAt:$startedAt,completedAt:$completedAt){id}
            }`, vars);
          }

          const v = await viewer();
          if (v.name !== targetUser) {
            throw new Error(`Authenticated AniList account is ${v.name}; expected ${targetUser}`);
          }

          const resolved = [];
          for (const item of requested) {
            resolved.push({item, media: await resolveMedia(item)});
          }

          console.log("CHECK_RESULTS_START");
          for (const {item, media} of resolved) {
            console.log(JSON.stringify({
              title:item.exact,
              mediaId:media.id,
              episodes:media.episodes,
              status:media.mediaListEntry?.status ?? null,
              progress:media.mediaListEntry?.progress ?? null
            }));
          }
          console.log("CHECK_RESULTS_END");

          const needs = resolved.filter(({media}) =>
            media.mediaListEntry?.status !== "COMPLETED" ||
            media.mediaListEntry?.progress !== media.episodes
          );

          const originalOptions = (v.options?.disabledListActivity ?? []).map(x => ({
            type:x.type, disabled:Boolean(x.disabled)
          }));
          let activityChanged = false;

          try {
            if (needs.length) {
              const suppressed = originalOptions.map(x => ({
                ...x,
                disabled: x.type === "COMPLETED" ? true : x.disabled
              }));
              activityChanged = suppressed.some((x,i) => x.disabled !== originalOptions[i]?.disabled);
              if (activityChanged) {
                await setActivityOptions(suppressed);
                console.log("Temporarily suppressed COMPLETED list activity.");
              }

              for (const {item, media} of needs) {
                const before = media.mediaListEntry;
                const saved = await saveComplete(media.id, media.episodes);
                await clearAutoDates(saved, before);
                const verify = await resolveMedia(item);
                if (verify.mediaListEntry?.status !== "COMPLETED" || verify.mediaListEntry?.progress !== verify.episodes) {
                  throw new Error(`${item.exact}: verification failed after update`);
                }
                console.log(`UPDATED: ${item.exact} -> COMPLETED ${verify.episodes}/${verify.episodes}`);
              }
            }
          } finally {
            if (activityChanged) {
              await setActivityOptions(originalOptions);
              console.log("Restored AniList list-activity preferences.");
            }
          }

          const final = [];
          for (const item of requested) {
            const media = await resolveMedia(item);
            final.push({
              title:item.exact,
              mediaId:media.id,
              episodes:media.episodes,
              status:media.mediaListEntry?.status ?? null,
              progress:media.mediaListEntry?.progress ?? null
            });
          }

          const bad = final.filter(x => x.status !== "COMPLETED" || x.progress !== x.episodes);
          if (bad.length) throw new Error(`Final verification failed: ${JSON.stringify(bad)}`);

          console.log("FINAL_VERIFICATION_OK");
          console.log(JSON.stringify({updatedCount:needs.length, final}, null, 2));
          NODE
