name: Authorized AniDB Completed-only Apply

on:
  push:
    branches:
      - ops/anidb-completed-only-apply-20261007
    paths:
      - .github/workflows/anidb-authorized-apply.yml

permissions:
  contents: read

concurrency:
  group: anidb-completed-only-authorized-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_USER: Luciedmeo
      ANIDB_HISTORY_BUNDLE_B64: ${{ secrets.ANIDB_HISTORY_BUNDLE_B64 }}
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify required repository secrets
        shell: bash
        run: |
          if [ -z "$ANIDB_HISTORY_BUNDLE_B64" ]; then
            echo "::error::Repository secret ANIDB_HISTORY_BUNDLE_B64 is not configured."
            exit 1
          fi
          if [ -z "$ANILIST_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret ANILIST_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Decode private AniDB history bundle
        shell: bash
        run: |
          printf '%s' "$ANIDB_HISTORY_BUNDLE_B64" |
            base64 --decode |
            gzip -dc > "$RUNNER_TEMP/anidb-history.json"

          jq -e '.version == 1 and (.anime | type == "array")'             "$RUNNER_TEMP/anidb-history.json" >/dev/null

      - name: Apply user-approved completed-only migration with feed suppression
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          node dist/anidb-migration-write.js             --history-bundle "$RUNNER_TEMP/anidb-history.json"             --user "$TARGET_USER"             --output "$RUNNER_TEMP/anidb-write-report.json"             --apply             --confirm "APPLY_COMPLETED_ONLY_130"             --activity-mode suppress

      - name: Encrypt migration report
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/anidb-write-report.json" ]; then
            REPORT_KEY="$(printf '%s' "$ANIDB_HISTORY_BUNDLE_B64" | sha256sum | cut -d' ' -f1)"
            REPORT_KEY="$REPORT_KEY" openssl enc               -aes-256-cbc               -salt               -pbkdf2               -a               -A               -in "$RUNNER_TEMP/anidb-write-report.json"               -out "$RUNNER_TEMP/anidb-write-report.enc.txt"               -pass env:REPORT_KEY
          fi

      - name: Upload encrypted migration report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anidb-authorized-apply-${{ github.run_id }}
          path: ${{ runner.temp }}/anidb-write-report.enc.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove plaintext private data
        if: always()
        shell: bash
        run: |
          rm -f             "$RUNNER_TEMP/anidb-history.json"             "$RUNNER_TEMP/anidb-write-report.json"

      - name: Fail workflow if apply failed
        if: steps.apply.outcome != 'success'
        shell: bash
        run: |
          echo "::error::The approved completed-only migration failed. Review the encrypted audit artifact if present."
          exit 1
