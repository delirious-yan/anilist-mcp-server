name: Authorized AniDB Completed-only Apply

on:
  push:
    branches:
      - ops/anidb-completed-only-apply-20261007
    paths:
      - .github/workflows/anidb-authorized-apply.yml

permissions:
  contents: read

concurrency:
  group: anidb-completed-only-authorized-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_USER: Luciedmeo
      ANIDB_HISTORY_BUNDLE_B64: ${{ secrets.ANIDB_HISTORY_BUNDLE_B64 }}
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify required repository secrets
        shell: bash
        run: |
          if [ -z "$ANIDB_HISTORY_BUNDLE_B64" ]; then
            echo "::error::Repository secret ANIDB_HISTORY_BUNDLE_B64 is not configured."
            exit 1
          fi
          if [ -z "$ANILIST_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret ANILIST_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Decode private AniDB history bundle
        shell: bash
        run: |
          printf '%s' "$ANIDB_HISTORY_BUNDLE_B64" |
            base64 --decode |
            gzip -dc > "$RUNNER_TEMP/anidb-history.json"

          jq -e '.version == 1 and (.anime | type == "array")'             "$RUNNER_TEMP/anidb-history.json" >/dev/null

      - name: Apply approved migration with temporary adult visibility and feed suppression
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          viewer_query='query{Viewer{name options{displayAdultContent}}}'

          read_viewer() {
            local out="$RUNNER_TEMP/viewer-options.json"
            local payload code
            payload="$(jq -nc --arg q "$viewer_query" '{query:$q,variables:{}}')"
            code="$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST https://graphql.anilist.co \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer $ANILIST_ACCESS_TOKEN" \
              --data "$payload")"

            if [ "$code" != "200" ] || jq -e '.errors and (.errors|length>0)' "$out" >/dev/null; then
              echo "::error::Could not read AniList viewer preferences (HTTP $code)."
              jq '{errors}' "$out" || true
              return 1
            fi
          }

          set_adult_visibility() {
            local enabled="$1"
            local out="$RUNNER_TEMP/update-adult.json"
            local mutation payload code
            mutation='mutation($enabled:Boolean){UpdateUser(displayAdultContent:$enabled){id}}'
            payload="$(jq -nc --arg q "$mutation" --argjson enabled "$enabled" \
              '{query:$q,variables:{enabled:$enabled}}')"
            code="$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST https://graphql.anilist.co \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer $ANILIST_ACCESS_TOKEN" \
              --data "$payload")"

            if [ "$code" != "200" ] || jq -e '.errors and (.errors|length>0)' "$out" >/dev/null; then
              echo "::error::Could not set AniList adult-content preference to $enabled (HTTP $code)."
              jq '{errors}' "$out" || true
              return 1
            fi

            read_viewer
            local observed
            observed="$(jq -r '.data.Viewer.options.displayAdultContent' "$RUNNER_TEMP/viewer-options.json")"
            if [ "$observed" != "$enabled" ]; then
              echo "::error::AniList adult-content preference verification failed: expected $enabled, got $observed."
              return 1
            fi
          }

          read_viewer
          viewer="$(jq -r '.data.Viewer.name // empty' "$RUNNER_TEMP/viewer-options.json")"
          original_adult="$(jq -r '.data.Viewer.options.displayAdultContent' "$RUNNER_TEMP/viewer-options.json")"

          if [ "$viewer" != "$TARGET_USER" ]; then
            echo "::error::Authenticated AniList account is $viewer; expected $TARGET_USER."
            exit 1
          fi
          if [ "$original_adult" != "true" ] && [ "$original_adult" != "false" ]; then
            echo "::error::Unexpected displayAdultContent value: $original_adult"
            exit 1
          fi

          adult_changed=false
          restore_adult() {
            local status=$?
            trap - EXIT
            if [ "$adult_changed" = "true" ]; then
              echo "Restoring AniList adult-content preference to $original_adult..."
              if ! set_adult_visibility "$original_adult"; then
                echo "::error::Migration step ended and the original adult-content preference could not be restored."
                exit 1
              fi
              echo "Adult-content preference restored and verified."
            fi
            exit "$status"
          }
          trap restore_adult EXIT

          if [ "$original_adult" != "true" ]; then
            adult_changed=true
            echo "Temporarily enabling AniList adult-content visibility..."
            set_adult_visibility true
            echo "Temporary adult-content visibility enabled and verified."
          else
            echo "Adult-content visibility was already enabled; original setting will be preserved."
          fi

          echo "Preflighting the five previously unavailable approved targets before any list write..."
          for media_id in 382 1632 2445 2539 3050; do
            out="$RUNNER_TEMP/preflight-$media_id.json"
            query='query($id:Int){Media(id:$id,type:ANIME){id}}'
            payload="$(jq -nc --arg q "$query" --argjson id "$media_id" \
              '{query:$q,variables:{id:$id}}')"
            code="$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST https://graphql.anilist.co \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer $ANILIST_ACCESS_TOKEN" \
              --data "$payload")"

            if [ "$code" != "200" ] || jq -e '.errors and (.errors|length>0)' "$out" >/dev/null; then
              echo "::error::Approved adult-only target $media_id is still unavailable (HTTP $code). No migration writes will start."
              jq '{errors}' "$out" || true
              exit 1
            fi
            observed_id="$(jq -r '.data.Media.id // empty' "$out")"
            if [ "$observed_id" != "$media_id" ]; then
              echo "::error::Approved target $media_id did not resolve correctly. No migration writes will start."
              exit 1
            fi
          done
          echo "Adult-only target preflight passed."

          node dist/anidb-migration-write.js \
            --history-bundle "$RUNNER_TEMP/anidb-history.json" \
            --user "$TARGET_USER" \
            --output "$RUNNER_TEMP/anidb-write-report.json" \
            --apply \
            --confirm "APPLY_COMPLETED_ONLY_108" \
            --activity-mode suppress

      - name: Encrypt migration report
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/anidb-write-report.json" ]; then
            REPORT_KEY="$(printf '%s' "$ANIDB_HISTORY_BUNDLE_B64" | sha256sum | cut -d' ' -f1)"
            REPORT_KEY="$REPORT_KEY" openssl enc               -aes-256-cbc               -salt               -pbkdf2               -a               -A               -in "$RUNNER_TEMP/anidb-write-report.json"               -out "$RUNNER_TEMP/anidb-write-report.enc.txt"               -pass env:REPORT_KEY
          fi

      - name: Upload encrypted migration report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anidb-authorized-apply-${{ github.run_id }}
          path: ${{ runner.temp }}/anidb-write-report.enc.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove plaintext private data
        if: always()
        shell: bash
        run: |
          rm -f             "$RUNNER_TEMP/anidb-history.json"             "$RUNNER_TEMP/anidb-write-report.json"

      - name: Fail workflow if apply failed
        if: steps.apply.outcome != 'success'
        shell: bash
        run: |
          echo "::error::The approved completed-only migration failed. Review the encrypted audit artifact if present."
          exit 1
