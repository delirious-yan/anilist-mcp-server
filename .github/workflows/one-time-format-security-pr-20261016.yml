name: One-time format security PR
on:
  push:
    branches:
      - security/ani-public-hygiene-20261016
    paths:
      - .github/workflows/one-time-format-security-pr-20261016.yml

permissions:
  contents: read

jobs:
  format-reviewed-branch:
    if: ${{ github.repository == 'delirious-yan/anilist-mcp-server' && github.event_name == 'push' && github.ref == 'refs/heads/security/ani-public-hygiene-20261016' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted review branch without persisting token
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: security/ani-public-hygiene-20261016
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format the four already-public files
        run: npx prettier --write .agents/skills/anilist-github-actions-write/SKILL.md .github/workflows/anilist-single-entry-sync.yml AGENTS.md scripts/sync-anilist-request.mjs
      - name: Print verified formatted source chunks (public files only)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const paths = [
            '.agents/skills/anilist-github-actions-write/SKILL.md',
            '.github/workflows/anilist-single-entry-sync.yml',
            'AGENTS.md',
            'scripts/sync-anilist-request.mjs',
          ];
          for (const path of paths) {
            const content = readFileSync(path, 'utf8');
            for (let offset = 0; offset < content.length; offset += 512) {
              console.log('FORMATTED_PUBLIC_SOURCE:' + JSON.stringify({
                path, offset, total: content.length, chunk: content.slice(offset, offset + 512),
              }));
            }
          }
          NODE
