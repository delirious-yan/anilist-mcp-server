name: One-time format security PR
on:
  push:
    branches:
      - security/ani-public-hygiene-20261016
    paths:
      - .github/workflows/one-time-format-security-pr-20261016.yml

permissions:
  contents: write

jobs:
  format-reviewed-branch:
    if: ${{ github.repository == 'delirious-yan/anilist-mcp-server' && github.event_name == 'push' && github.ref == 'refs/heads/security/ani-public-hygiene-20261016' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: security/ani-public-hygiene-20261016
          persist-credentials: true
      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Format known four files only
        run: npx prettier --write .agents/skills/anilist-github-actions-write/SKILL.md .github/workflows/anilist-single-entry-sync.yml AGENTS.md scripts/sync-anilist-request.mjs
      - name: Commit formatting only to the temporary PR branch
        run: |
          git add -- .agents/skills/anilist-github-actions-write/SKILL.md .github/workflows/anilist-single-entry-sync.yml AGENTS.md scripts/sync-anilist-request.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply pinned Prettier to previously failing files'
          git push origin HEAD:refs/heads/security/ani-public-hygiene-20261016
