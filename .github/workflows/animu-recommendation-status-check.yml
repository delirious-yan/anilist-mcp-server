name: Inspect Demon Slayer Franchise

on:
  push:
    branches: [animu/recommendation-status-check-20261007]
    paths: [.github/workflows/animu-recommendation-status-check.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
    steps:
      - name: List Demon Slayer anime entries
        shell: bash
        run: |
          node <<'NODE'
          const endpoint="https://graphql.anilist.co";
          const token=process.env.ANILIST_ACCESS_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function gql(query,variables={}){
            for(let i=0;i<5;i++){
              const res=await fetch(endpoint,{method:"POST",headers:{
                "Content-Type":"application/json","Accept":"application/json",
                "Authorization":"Bearer "+token
              },body:JSON.stringify({query,variables})});
              let p=null; try{p=await res.json()}catch{}
              if((res.status===429||p?.errors?.some(e=>e?.status===429))&&i<4){await sleep(3000*(i+1));continue;}
              if(!res.ok||p?.errors) throw new Error(JSON.stringify(p?.errors??p??{status:res.status}));
              return p.data;
            }
          }
          const d=await gql(`query{
            Page(page:1,perPage:50){
              media(search:"Kimetsu no Yaiba",type:ANIME,sort:START_DATE){
                id format status episodes
                title{english romaji}
                startDate{year month day}
                mediaListEntry{id status progress}
              }
            }
          }`);
          for(const m of d.Page.media){
            console.log(JSON.stringify({
              id:m.id,title:m.title.english||m.title.romaji,romaji:m.title.romaji,
              format:m.format,status:m.status,episodes:m.episodes,startDate:m.startDate,
              listStatus:m.mediaListEntry?.status??null,progress:m.mediaListEntry?.progress??null
            }));
          }
          NODE
