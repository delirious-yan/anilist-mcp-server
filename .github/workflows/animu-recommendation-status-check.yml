name: Verify Anime Hiatus Timeline

on:
  push:
    branches: [animu/recommendation-status-check-20261007]
    paths: [.github/workflows/animu-recommendation-status-check.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANIDB_HISTORY_BUNDLE_B64: ${{ secrets.ANIDB_HISTORY_BUNDLE_B64 }}
    steps:
      - name: Analyze historical viewing gaps
        shell: bash
        run: |
          if [ -z "$ANIDB_HISTORY_BUNDLE_B64" ]; then
            echo "::error::ANIDB_HISTORY_BUNDLE_B64 is not configured."
            exit 1
          fi
          printf '%s' "$ANIDB_HISTORY_BUNDLE_B64" | base64 --decode | gzip -dc > "$RUNNER_TEMP/history.json"
          node <<'NODE'
          const fs=require("fs");
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/history.json","utf8"));
          const watched=(p.anime||[])
            .filter(x=>x.lastViewedAt>0)
            .sort((a,b)=>a.lastViewedAt-b.lastViewedAt);

          const rows=watched.map(x=>({
            title:x.title,
            state:x.watchState,
            watched:x.watchedNormalEpisodes,
            total:x.totalEpisodes,
            first:x.firstViewedDate,
            last:x.lastViewedDate,
            t:x.lastViewedAt
          }));

          const gaps=[];
          for(let i=1;i<rows.length;i++){
            const days=Math.round((rows[i].t-rows[i-1].t)/86400);
            gaps.push({days,before:rows[i-1],after:rows[i]});
          }
          gaps.sort((a,b)=>b.days-a.days);

          console.log("LARGEST_GAPS");
          for(const g of gaps.slice(0,12)){
            console.log(JSON.stringify({
              days:g.days,
              before:{title:g.before.title,last:g.before.last},
              after:{title:g.after.title,last:g.after.last}
            }));
          }

          console.log("WATCHES_2011_2016");
          for(const x of rows){
            const y=x.last?.year;
            if(y>=2011 && y<=2016){
              console.log(JSON.stringify({
                title:x.title,state:x.state,watched:x.watched,total:x.total,
                first:x.first,last:x.last
              }));
            }
          }

          console.log("YEAR_COUNTS");
          const byYear={};
          for(const x of rows){
            const y=x.last?.year;
            if(!y) continue;
            byYear[y]=(byYear[y]||0)+1;
          }
          console.log(JSON.stringify(byYear));
          NODE
          rm -f "$RUNNER_TEMP/history.json"
