name: Animu Recommendation Status Check 2

on:
  push:
    branches: [animu/recommendation-status-check-20261007]
    paths: [.github/workflows/animu-recommendation-status-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
    steps:
      - name: Check unrestricted candidates
        shell: bash
        run: |
          node <<'NODE'
          const endpoint="https://graphql.anilist.co";
          const token=process.env.ANILIST_ACCESS_TOKEN;
          const titles=[
            "Space Dandy","Golden Kamuy","Baccano!","ODDTAXI","PSYCHO-PASS",
            "91 Days","Samurai Champloo","Drifters","Mob Psycho 100","One Outs",
            "Kaiji: Ultimate Survivor","Heavenly Delusion","Mononoke"
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function gql(query,variables={}){
            for(let a=0;a<5;a++){
              const res=await fetch(endpoint,{method:"POST",headers:{
                "Content-Type":"application/json","Accept":"application/json",
                "Authorization":`Bearer ${token}`
              },body:JSON.stringify({query,variables})});
              let p=null; try{p=await res.json()}catch{}
              if((res.status===429||p?.errors?.some(e=>e.status===429))&&a<4){
                await sleep(3000*(a+1)); continue;
              }
              if(!res.ok||p?.errors) return {error:p?.errors??[{status:res.status}]};
              await sleep(800);
              return p.data;
            }
          }
          for(const search of titles){
            const d=await gql(`query($search:String){
              Media(search:$search,type:ANIME){
                id title{english romaji} episodes format
                mediaListEntry{id status progress score}
              }
            }`,{search});
            if(d?.error){console.log(JSON.stringify({search,error:d.error}));continue;}
            const m=d.Media;
            console.log(JSON.stringify({
              search,id:m?.id??null,title:m?.title?.english||m?.title?.romaji||null,
              episodes:m?.episodes??null,format:m?.format??null,
              status:m?.mediaListEntry?.status??null,
              progress:m?.mediaListEntry?.progress??null
            }));
          }
          NODE