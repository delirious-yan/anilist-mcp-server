name: Export Current Completed Anime

on:
  push:
    branches: [animu/recommendation-status-check-20261007]
    paths: [.github/workflows/animu-recommendation-status-check.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
      TARGET_USER: Luciedmeo
    steps:
      - name: Export current completed anime
        shell: bash
        run: |
          node <<'NODE'
          const endpoint="https://graphql.anilist.co";
          const token=process.env.ANILIST_ACCESS_TOKEN;
          const username=process.env.TARGET_USER;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function gql(query,variables={}){
            for(let attempt=0;attempt<6;attempt++){
              const res=await fetch(endpoint,{
                method:"POST",
                headers:{
                  "Content-Type":"application/json",
                  "Accept":"application/json",
                  "Authorization":"Bearer "+token
                },
                body:JSON.stringify({query,variables})
              });
              let p=null; try{p=await res.json()}catch{}
              const rl=res.status===429||p?.errors?.some(e=>e?.status===429||/too many requests/i.test(e?.message??""));
              if(rl&&attempt<5){
                const retryAfter=Number(res.headers.get("retry-after")||0);
                await sleep(Math.max(retryAfter*1000,3500*(attempt+1)));
                continue;
              }
              if(!res.ok||p?.errors) throw new Error(JSON.stringify(p?.errors??p??{status:res.status}));
              return p.data;
            }
            throw new Error("AniList retries exhausted");
          }

          const data=await gql(`query($userName:String){
            MediaListCollection(userName:$userName,type:ANIME,status:COMPLETED){
              lists{
                entries{
                  status progress repeat score
                  media{
                    id format episodes
                    startDate{year}
                    title{english romaji}
                  }
                }
              }
            }
          }`,{userName:username});

          const map=new Map();
          for(const list of data.MediaListCollection?.lists??[]){
            for(const e of list.entries??[]){
              const m=e.media;
              if(!m) continue;
              map.set(m.id,{
                id:m.id,
                title:m.title.english||m.title.romaji,
                romaji:m.title.romaji,
                format:m.format,
                year:m.startDate?.year??null,
                episodes:m.episodes??null,
                repeat:e.repeat??0,
                score:e.score??0,
                progress:e.progress??0
              });
            }
          }
          const rows=[...map.values()].sort((a,b)=>
            a.title.localeCompare(b.title,undefined,{sensitivity:"base"})
          );
          console.log("COMPLETED_COUNT="+rows.length);
          console.log("COMPLETED_LIST_JSON");
          console.log(JSON.stringify(rows));
          NODE
