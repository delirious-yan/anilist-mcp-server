name: Animu Recommendation Status Check

on:
  push:
    branches: [animu/recommendation-status-check-20261007]
    paths: [.github/workflows/animu-recommendation-status-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
      TARGET_USER: Luciedmeo
    steps:
      - name: Check candidate watch status
        shell: bash
        run: |
          node <<'NODE'
          const endpoint="https://graphql.anilist.co";
          const token=process.env.ANILIST_ACCESS_TOKEN;
          const userName=process.env.TARGET_USER;
          const titles=[
            "SAKAMOTO DAYS",
            "Delicious in Dungeon",
            "PLUTO",
            "Terminator Zero",
            "Great Pretender",
            "BNA",
            "AJIN: Demi-Human",
            "SPRIGGAN",
            "Leviathan",
            "Moonrise",
            "My Daemon",
            "Space Dandy",
            "Golden Kamuy",
            "Baccano!",
            "ODDTAXI",
            "PSYCHO-PASS",
            "91 Days",
            "Samurai Champloo",
            "Drifters",
            "Mob Psycho 100",
            "One Outs",
            "Kaiji",
            "Heavenly Delusion",
            "Mononoke"
          ];
          async function gql(query,variables={}){
            const res=await fetch(endpoint,{method:"POST",headers:{
              "Content-Type":"application/json","Accept":"application/json",
              ...(token?{Authorization:`Bearer ${token}`}:{})
            },body:JSON.stringify({query,variables})});
            const p=await res.json();
            if(!res.ok||p.errors) throw new Error(JSON.stringify(p.errors??p));
            return p.data;
          }
          for(const search of titles){
            const d=await gql(`query($search:String){
              Media(search:$search,type:ANIME){
                id title{english romaji} episodes format status
                mediaListEntry{id status progress score}
              }
            }`,{search});
            const m=d.Media;
            console.log(JSON.stringify({
              search,
              id:m?.id??null,
              title:m?.title?.english||m?.title?.romaji||null,
              romaji:m?.title?.romaji||null,
              episodes:m?.episodes??null,
              format:m?.format??null,
              status:m?.mediaListEntry?.status??null,
              progress:m?.mediaListEntry?.progress??null,
              score:m?.mediaListEntry?.score??null
            }));
          }
          NODE
