name: AniDB Target Probe Current

on:
  push:
    branches:
      - ops/anidb-target-probe-current
    paths:
      - .github/workflows/anidb-target-probe-current.yml
      - src/anidb-target-probe.ts
      - tsup.config.ts

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ANIDB_HISTORY_BUNDLE_B64: ${{ secrets.ANIDB_HISTORY_BUNDLE_B64 }}
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Decode private AniDB history bundle
        shell: bash
        run: |
          test -n "$ANIDB_HISTORY_BUNDLE_B64"
          printf '%s' "$ANIDB_HISTORY_BUNDLE_B64" | base64 --decode | gzip -dc > "$RUNNER_TEMP/anidb-history.json"
      - name: Probe all current remaining completed targets
        shell: bash
        run: node dist/anidb-target-probe.js "$RUNNER_TEMP/anidb-history.json"
      - name: Remove plaintext private data
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/anidb-history.json"
