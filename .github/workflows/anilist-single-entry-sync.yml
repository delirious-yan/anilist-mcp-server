name: AniList single or batch sync
on:
  push:
    branches: [main]
    paths: ["anilist-requests/current.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anilist-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'delirious-yan/anilist-mcp-server'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Apply validated single or batch request
        env:
          ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
        run: node scripts/sync-anilist-request.mjs anilist-requests/current.json
