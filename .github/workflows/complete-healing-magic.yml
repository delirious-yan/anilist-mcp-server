# One-title, idempotent owner-requested AniList update (2026-10-09).
# No token or private data is committed. No unrelated list entries are changed.
name: Complete Healing Magic on AniList

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-healing-magic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anilist-complete-healing-magic
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'delirious-yan/anilist-mcp-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
    steps:
      - name: Check account, update one anime, and verify
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.ANILIST_ACCESS_TOKEN;
          if (!token) {
            console.error('Missing GitHub Actions secret ANILIST_ACCESS_TOKEN. No changes made.');
            process.exit(1);
          }

          async function graphql(query, variables = {}) {
            const response = await fetch('https://graphql.anilist.co', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ query, variables }),
              signal: AbortSignal.timeout(20000),
            });
            const result = await response.json();
            if (!response.ok || result.errors?.length || !result.data) {
              const message = result.errors?.map(e => e.message).join('; ') || `HTTP ${response.status}`;
              throw new Error(`AniList GraphQL request failed: ${message}`);
            }
            return result.data;
          }

          const { Viewer: viewer } = await graphql('query { Viewer { id name } }');
          if (viewer?.name?.toLowerCase() !== 'luciedmeo') {
            throw new Error('Authenticated AniList account does not match target Luciedmeo. No changes made.');
          }

          const mediaId = 137908; // 2024 TV Season 1: Chiyu Mahou no Machigatta Tsukaikata
          const detailQuery = `query ($id: Int!) {
            Media(id: $id, type: ANIME) {
              id format episodes seasonYear
              title { romaji english }
              mediaListEntry { id status progress score notes repeat }
            }
          }`;
          const read = async () => (await graphql(detailQuery, { id: mediaId })).Media;
          const anime = await read();
          if (!anime || anime.id !== mediaId || anime.format !== 'TV' ||
              anime.episodes !== 13 || anime.seasonYear !== 2024 ||
              !anime.title?.romaji?.toLowerCase().includes('chiyu mahou no machigatta tsukaikata')) {
            throw new Error('Anime identity/episode verification failed. No changes made.');
          }

          const before = anime.mediaListEntry;
          if (before?.status === 'REPEATING') {
            throw new Error('Entry is currently REPEATING; refusing to overwrite rewatch state.');
          }
          if ((before?.progress ?? 0) > 13) {
            throw new Error('Unexpected current progress greater than 13; no changes made.');
          }

          if (before?.status !== 'COMPLETED' || before?.progress !== 13) {
            const mutation = `mutation ($mediaId: Int!, $status: MediaListStatus, $progress: Int) {
              SaveMediaListEntry(mediaId: $mediaId, status: $status, progress: $progress) {
                id mediaId status progress
              }
            }`;
            const updated = (await graphql(mutation, {
              mediaId, status: 'COMPLETED', progress: 13,
            })).SaveMediaListEntry;
            if (updated?.mediaId !== mediaId ||
                updated.status !== 'COMPLETED' || updated.progress !== 13) {
              throw new Error('AniList mutation response could not verify expected completion.');
            }
            console.log('Completed entry update submitted for the verified target.');
          } else {
            console.log('Target is already Completed with 13/13; no mutation needed.');
          }

          const after = (await read())?.mediaListEntry;
          if (after?.status !== 'COMPLETED' || after?.progress !== 13) {
            throw new Error('Read-back verification failed.');
          }
          if (before && (before.score !== after.score || before.notes !== after.notes ||
              before.repeat !== after.repeat)) {
            throw new Error('Read-back detected an unexpected change to score/notes/repeat.');
          }
          console.log('Verified Luciedmeo / The Wrong Way to Use Healing Magic S1: COMPLETED 13/13.');
          NODE
