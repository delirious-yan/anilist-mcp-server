name: Animu Manual AniList Completion Recovery

on:
  push:
    branches:
      - animu/anilist-manual-completion-20261007
    paths:
      - .github/workflows/animu-manual-anilist-completion.yml

permissions:
  contents: read

concurrency:
  group: animu-manual-anilist-completion
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
      TARGET_USER: Luciedmeo
    steps:
      - name: Recover rate-limited update and restore activity preference
        shell: bash
        run: |
          if [ -z "$ANILIST_ACCESS_TOKEN" ]; then
            echo "::error::ANILIST_ACCESS_TOKEN is not configured."
            exit 1
          fi

          node <<'NODE'
          const endpoint = "https://graphql.anilist.co";
          const token = process.env.ANILIST_ACCESS_TOKEN;
          const targetUser = process.env.TARGET_USER;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const targets = [
            { id: 182, episodes: 26, label: "Vision of Escaflowne" },
            { id: 112301, episodes: 13, label: "The Misfit of Demon King Academy" },
            { id: 130588, episodes: 12, label: "The Misfit of Demon King Academy II" },
            { id: 130590, episodes: 12, label: "The Misfit of Demon King Academy II Part 2" },
            { id: 21202, episodes: 10, label: "KONOSUBA Season 1" },
            { id: 21699, episodes: 10, label: "KONOSUBA Season 2" },
            { id: 136804, episodes: 11, label: "KONOSUBA Season 3" },
          ];

          async function gql(query, variables = {}) {
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Authorization": `Bearer ${token}`,
                },
                body: JSON.stringify({ query, variables }),
              });

              let payload;
              try {
                payload = await response.json();
              } catch {
                payload = null;
              }

              const rateLimited =
                response.status === 429 ||
                payload?.errors?.some((e) => e?.status === 429 || /too many requests/i.test(e?.message ?? ""));

              if (rateLimited && attempt < 5) {
                const retryAfter = Number(response.headers.get("retry-after") || 0);
                const delayMs = Math.max(retryAfter * 1000, 5000 * (attempt + 1));
                console.log(`Rate limited; retrying in ${Math.round(delayMs / 1000)}s (attempt ${attempt + 2}/6)`);
                await sleep(delayMs);
                continue;
              }

              if (!response.ok || payload?.errors) {
                throw new Error(`AniList GraphQL error: ${JSON.stringify(payload?.errors ?? payload ?? {status: response.status})}`);
              }

              await sleep(2200);
              return payload.data;
            }
            throw new Error("AniList request retries exhausted");
          }

          function hasDate(value) {
            return Boolean(value && (value.year || value.month || value.day));
          }

          async function getViewer() {
            return (await gql(`query{
              Viewer{
                name
                options{disabledListActivity{type disabled}}
              }
            }`)).Viewer;
          }

          async function setCompletedActivityDisabled(disabled) {
            const viewer = await getViewer();
            const options = (viewer.options?.disabledListActivity ?? []).map((option) => ({
              type: option.type,
              disabled: option.type === "COMPLETED" ? disabled : Boolean(option.disabled),
            }));
            await gql(
              `mutation($options:[ListActivityOptionInput]){
                UpdateUser(disabledListActivity:$options){id}
              }`,
              { options },
            );
            const verify = await getViewer();
            const completed = verify.options?.disabledListActivity?.find((x) => x.type === "COMPLETED");
            if (Boolean(completed?.disabled) !== disabled) {
              throw new Error(`COMPLETED activity preference expected ${disabled}, got ${completed?.disabled}`);
            }
          }

          async function readMedia(id) {
            const data = await gql(
              `query($id:Int){
                Media(id:$id,type:ANIME){
                  id
                  status
                  episodes
                  title{romaji english}
                  mediaListEntry{
                    id
                    status
                    progress
                    startedAt{year month day}
                    completedAt{year month day}
                  }
                }
              }`,
              { id },
            );
            if (!data.Media) throw new Error(`AniList media ${id} was not found`);
            return data.Media;
          }

          async function saveCompleted(mediaId, progress) {
            return (await gql(
              `mutation($mediaId:Int,$status:MediaListStatus,$progress:Int){
                SaveMediaListEntry(mediaId:$mediaId,status:$status,progress:$progress){
                  id status progress
                  startedAt{year month day}
                  completedAt{year month day}
                }
              }`,
              { mediaId, status: "COMPLETED", progress },
            )).SaveMediaListEntry;
          }

          async function clearAutoDates(entry, before) {
            const clearStarted = !hasDate(before?.startedAt) && hasDate(entry.startedAt);
            const clearCompleted = !hasDate(before?.completedAt) && hasDate(entry.completedAt);
            if (!clearStarted && !clearCompleted) return;

            const variables = { id: entry.id };
            if (clearStarted) variables.startedAt = {};
            if (clearCompleted) variables.completedAt = {};
            await gql(
              `mutation($id:Int,$startedAt:FuzzyDateInput,$completedAt:FuzzyDateInput){
                SaveMediaListEntry(id:$id,startedAt:$startedAt,completedAt:$completedAt){id}
              }`,
              variables,
            );
          }

          const viewer = await getViewer();
          if (viewer.name !== targetUser) {
            throw new Error(`Authenticated AniList account is ${viewer.name}; expected ${targetUser}`);
          }

          const currentCompletedActivity =
            viewer.options?.disabledListActivity?.find((x) => x.type === "COMPLETED")?.disabled ?? false;

          console.log(`Current COMPLETED activity disabled: ${Boolean(currentCompletedActivity)}`);

          const initial = [];
          for (const target of targets) {
            const media = await readMedia(target.id);
            if (media.status !== "FINISHED" || media.episodes !== target.episodes) {
              throw new Error(`${target.label}: AniList metadata mismatch (status=${media.status}, episodes=${media.episodes})`);
            }
            initial.push({ target, media });
          }

          const remaining = initial.filter(
            ({ target, media }) =>
              media.mediaListEntry?.status !== "COMPLETED" ||
              media.mediaListEntry?.progress !== target.episodes,
          );

          console.log(`Remaining mismatches before recovery: ${remaining.length}`);
          for (const { target, media } of remaining) {
            console.log(`NEEDS_UPDATE: ${target.label} current=${media.mediaListEntry?.status ?? "none"} progress=${media.mediaListEntry?.progress ?? 0}`);
          }

          let suppressedForRecovery = Boolean(currentCompletedActivity);

          try {
            if (remaining.length && !suppressedForRecovery) {
              await setCompletedActivityDisabled(true);
              suppressedForRecovery = true;
              console.log("Temporarily suppressed COMPLETED activity for recovery write.");
            }

            for (const { target, media } of remaining) {
              const before = media.mediaListEntry;
              const entry = await saveCompleted(target.id, target.episodes);
              await clearAutoDates(entry, before);

              const verify = await readMedia(target.id);
              if (
                verify.mediaListEntry?.status !== "COMPLETED" ||
                verify.mediaListEntry?.progress !== target.episodes
              ) {
                throw new Error(`${target.label}: recovery verification failed`);
              }
              if (!hasDate(before?.startedAt) && hasDate(verify.mediaListEntry?.startedAt)) {
                throw new Error(`${target.label}: auto-generated startedAt was not cleared`);
              }
              if (!hasDate(before?.completedAt) && hasDate(verify.mediaListEntry?.completedAt)) {
                throw new Error(`${target.label}: auto-generated completedAt was not cleared`);
              }
              console.log(`UPDATED: ${target.label} -> COMPLETED ${target.episodes}/${target.episodes}`);
            }
          } finally {
            // The first run proved the original COMPLETED activity preference was false:
            // it logged a transition from false -> true before the 429 interrupted restoration.
            await setCompletedActivityDisabled(false);
            console.log("Restored COMPLETED activity preference to original value: false.");
          }

          const final = [];
          for (const target of targets) {
            const media = await readMedia(target.id);
            final.push({
              label: target.label,
              status: media.mediaListEntry?.status ?? null,
              progress: media.mediaListEntry?.progress ?? null,
              expected: target.episodes,
            });
          }

          const bad = final.filter((x) => x.status !== "COMPLETED" || x.progress !== x.expected);
          if (bad.length) {
            throw new Error(`Final verification failed: ${JSON.stringify(bad)}`);
          }

          const finalViewer = await getViewer();
          const finalCompletedActivity =
            finalViewer.options?.disabledListActivity?.find((x) => x.type === "COMPLETED")?.disabled ?? false;
          if (finalCompletedActivity) {
            throw new Error("COMPLETED activity preference is still disabled after recovery");
          }

          console.log("FINAL_VERIFICATION_OK");
          console.log(JSON.stringify({ targetUser, finalCompletedActivity, final }, null, 2));
          NODE
