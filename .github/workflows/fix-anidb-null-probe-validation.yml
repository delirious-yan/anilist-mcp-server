name: Validate AniDB Null Probe Fix

on:
  push:
    branches:
      - fix/anidb-null-list-entry-probe
    paths:
      - .github/workflows/fix-anidb-null-probe-validation.yml
      - src/anidb-migration-write.ts
      - src/importers/anidbWrite.ts
      - src/__tests__/anidbWrite.test.ts

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
