name: One-time remove exposed taste-analysis logs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-delete-exposed-taste-logs-20261016.yml

permissions:
  actions: write
  contents: read

jobs:
  delete-single-public-log:
    if: >-
      github.repository == 'delirious-yan/anilist-mcp-server' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'privacy remove exposed logs approved' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove only October 7 public taste analysis logs, retain run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE repos/delirious-yan/anilist-mcp-server/actions/runs/37571602984/logs
          echo "Requested log deletion for the sole owner-approved run ID 37571602984"
