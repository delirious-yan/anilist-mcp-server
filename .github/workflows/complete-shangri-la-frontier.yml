# One-time, owner-approved AniList completion of Shangri-La Frontier's first two TV seasons.
# Exact account check, exact 25-episode series, preservation, authenticated read-back.
name: Complete Shangri-La Frontier on AniList

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-shangri-la-frontier.yml

permissions:
  contents: read

concurrency:
  group: anilist-complete-shangri-la-frontier
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'delirious-yan/anilist-mcp-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
    steps:
      - name: Verify account and both anime seasons, apply minimal completion, read back
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.ANILIST_ACCESS_TOKEN;
          if (!token) throw new Error('Missing AniList Actions credential; no mutation attempted.');
          const baseId = 151970; // Shangri-La Frontier (Fall 2023 TV; 25 episodes).
          async function gql(query, variables = {}) {
            const response = await fetch('https://graphql.anilist.co', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
              body: JSON.stringify({ query, variables }),
              signal: AbortSignal.timeout(20000),
            });
            const body = await response.json();
            if (!response.ok || body.errors?.length || !body.data) {
              throw new Error('AniList request failed (HTTP ' + response.status + '); no private response logged.');
            }
            return body.data;
          }
          const viewer = (await gql('query { Viewer { id name } }')).Viewer;
          if (!viewer || viewer.name?.toLowerCase() !== 'luciedmeo') {
            throw new Error('Authenticated viewer is not the approved AniList account; no mutation attempted.');
          }
          const relations = (await gql(`query($id:Int!) {
            Media(id:$id,type:ANIME) {
              id format episodes seasonYear title{romaji english}
              relations{edges{relationType node{id format episodes seasonYear title{romaji english}}}}
            }
          }`, { id: baseId })).Media;
          if (!relations || relations.id !== baseId || relations.format !== 'TV' ||
              relations.episodes !== 25 || relations.seasonYear !== 2023 ||
              relations.title?.romaji !== 'Shangri-La Frontier') {
            throw new Error('First-season identity check failed; no mutation attempted.');
          }
          const sequels = (relations.relations?.edges ?? [])
            .filter(e => e?.relationType === 'SEQUEL')
            .map(e => e?.node)
            .filter(n => n && n.format === 'TV' && n.episodes === 25 &&
                         n.seasonYear === 2024 &&
                         /^Shangri-La Frontier 2nd Season$/i.test(n.title?.romaji ?? ''));
          if (sequels.length !== 1) throw new Error('Cannot unambiguously identify the 2024 second season; no mutation.');
          const targets = [
            { id: baseId, year: 2023, title: 'Shangri-La Frontier', label: 'Season 1' },
            { id: sequels[0].id, year: 2024, title: 'Shangri-La Frontier 2nd Season', label: 'Season 2' },
          ];
          const selection = `id format episodes seasonYear title{romaji english}
            mediaListEntry{id status progress scoreRaw notes repeat priority private
              hiddenFromStatusLists customLists(asArray:true) advancedScores
              startedAt{year month day} completedAt{year month day}}`;
          const read = async id => (await gql(
            `query($id:Int!) { Media(id:$id,type:ANIME){${selection}} }`, { id }
          )).Media;
          const before = [];
          for (const target of targets) {
            const media = await read(target.id);
            if (!media || media.id !== target.id || media.format !== 'TV' ||
                media.episodes !== 25 || media.seasonYear !== target.year ||
                media.title?.romaji !== target.title) {
              throw new Error('Identity/progress preflight failed for ' + target.label + '; no mutation.');
            }
            const entry = media.mediaListEntry;
            if (entry?.status === 'REPEATING' || entry?.status === 'DROPPED' ||
                (entry?.progress ?? 0) > 25 ||
                (entry?.progress ?? 0) < 0) {
              throw new Error('Conflicting existing status or progress for ' + target.label + '; no mutation.');
            }
            before.push(entry);
          }
          console.log('Verified AniList account and both independent 25-episode TV seasons.');
          const protectedFields = ['scoreRaw','notes','repeat','priority','private',
                                   'hiddenFromStatusLists','customLists','advancedScores'];
          const compare = (previous, current, label) => {
            if (!previous) return;
            for (const field of protectedFields) {
              if (JSON.stringify(previous[field]) !== JSON.stringify(current?.[field])) {
                throw new Error('Unexpected unrelated field change (' + field + ') for ' + label);
              }
            }
          };
          const mutation = `mutation($mediaId:Int!,$status:MediaListStatus,$progress:Int){
            SaveMediaListEntry(mediaId:$mediaId,status:$status,progress:$progress){
              id mediaId status progress
            }}`;
          for (let i = 0; i < targets.length; i++) {
            const target = targets[i];
            const old = before[i];
            if (old?.status === 'COMPLETED' && old.progress === 25) {
              console.log(target.label + ': already COMPLETED 25/25; skipped mutation.');
            } else {
              // Fresh read immediately before writing to detect conflicting changes.
              const fresh = (await read(target.id))?.mediaListEntry;
              if (JSON.stringify(fresh) !== JSON.stringify(old)) {
                throw new Error('Stale entry detected for ' + target.label + '; refusing overwrite.');
              }
              const updated = (await gql(mutation, {
                mediaId: target.id, status: 'COMPLETED', progress: 25,
              })).SaveMediaListEntry;
              if (!updated || updated.mediaId !== target.id ||
                  updated.status !== 'COMPLETED' || updated.progress !== 25) {
                throw new Error('Mutation response did not verify ' + target.label);
              }
              console.log(target.label + ': requested completion of 25 episodes.');
            }
            const current = (await read(target.id))?.mediaListEntry;
            if (!current || current.status !== 'COMPLETED' || current.progress !== 25)
              throw new Error('Independent authenticated read-back failed for ' + target.label);
            compare(old, current, target.label);
            console.log('Verified ' + target.label + ': COMPLETED 25/25; existing personal fields preserved.');
          }
          console.log('AniList complete: Shangri-La Frontier Seasons 1 and 2, account Luciedmeo.');
          NODE
